name: verify

# 四层项目自检（tools/verify.py）：每次推送自动跑全量断言 + 离线演示 + 物料校验。
# 结果实时反映在 README 顶部的 Tests 徽章。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  four-layer-check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow（GIF 生成与校验需要）
        run: python -m pip install pillow

      - name: 安装中文字体（GIF 渲染需要，Linux 无 Windows 字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 四层自检（退出码 0=全绿 1=有失败 2=用法错误）
        run: python tools/verify.py
